<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omoikane</title>
<link rel="icon" href="/icono.png">
<style>
/* Fuentes dentro del binario (OFL, assets/fuentes): la vista funciona sin internet. */
@font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; font-display: swap; src: url(/fuentes/plex-sans.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fuentes/plex-mono-400.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(/fuentes/plex-mono-600.woff2) format("woff2"); }
@font-face { font-family: "Shippori Mincho"; font-weight: 600; font-display: swap; src: url(/fuentes/shippori-600.woff2) format("woff2"); }
@font-face { font-family: "Shippori Mincho"; font-weight: 600; font-display: swap; src: url(/fuentes/shippori-600-omoikane.woff2) format("woff2"); unicode-range: U+517C, U+601D; }

/* Paleta del banner: negro cálido, cobre y ámbar, crema. En claro, papel cálido y cobre oscuro. */
:root {
  --bg: #0d0a08; --bg2: #120e0b; --panel: #18120e; --panel2: #201812; --line: #2f241b; --line2: #3d2f23;
  --ink: #f2e3cc; --ink2: #d9c6aa; --muted: #a8937b; --faint: #93806a;
  --accent: #e2894a; --glow: #f4b878; --accent-ink: #1a0f07; --sel: rgba(226,137,74,.13);
  --fact: oklch(0.78 0.09 235); --decision: oklch(0.78 0.09 305); --gotcha: oklch(0.78 0.09 35); --preference: oklch(0.78 0.09 150); --procedure: oklch(0.78 0.09 85);
  --add: rgba(110,190,130,.16); --addink: oklch(0.82 0.11 150); --del: rgba(226,96,74,.16); --delink: oklch(0.78 0.12 30);
  --shadow: 0 12px 32px rgba(0,0,0,.35); --halo: rgba(244,184,120,.25);
  --sans: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Shippori Mincho", "Yu Mincho", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5eee3; --bg2: #efe6d8; --panel: #fbf7f0; --panel2: #f4ecdf; --line: #e2d5c1; --line2: #d3c2a9;
    --ink: #23180f; --ink2: #3b2c1f; --muted: #6e5b47; --faint: #7a6652;
    --accent: #a4481c; --glow: #b0541c; --accent-ink: #fff8ef; --sel: rgba(164,72,28,.09);
    --fact: oklch(0.50 0.10 235); --decision: oklch(0.50 0.10 305); --gotcha: oklch(0.50 0.10 35); --preference: oklch(0.50 0.10 150); --procedure: oklch(0.50 0.10 85);
    --add: rgba(40,140,80,.12); --addink: oklch(0.45 0.11 150); --del: rgba(190,60,30,.11); --delink: oklch(0.48 0.13 30);
    --shadow: 0 1px 2px rgba(60,30,10,.06), 0 8px 24px rgba(60,30,10,.07); --halo: rgba(176,84,28,.12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
input, select, button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
a:hover { color: var(--glow); }
code, .mono { font-family: var(--mono); }
.serif { font-family: var(--serif); font-weight: 600; }
[hidden] { display: none !important; }

/* Cabecera */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--bg2); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand img { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line2), 0 0 18px var(--halo); }
.word { font: 600 19px/1 var(--serif); letter-spacing: .01em; }
.word .kj { color: var(--glow); margin-right: 6px; }
.nav { display: flex; gap: 2px; }
.nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; }
.nav a[aria-current=page] { background: var(--panel2); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 8px 2px; }
.search input::placeholder { color: var(--muted); }
.kbd { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--preference); }
.pill.mal { color: var(--delink); } .pill.mal .dot { background: var(--delink); }
main { flex: 1; min-height: 0; position: relative; }

/* Tipos */
.k { width: 8px; height: 8px; border-radius: 2px; flex: none; transform: rotate(45deg); display: inline-block; background: var(--faint); }
.k.fact { background: var(--fact); } .k.decision { background: var(--decision); } .k.gotcha { background: var(--gotcha); } .k.preference { background: var(--preference); } .k.procedure { background: var(--procedure); }
.k.pin { background: var(--glow); border-radius: 50%; transform: none; }
.kt { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kt.fact { color: var(--fact); } .kt.decision { color: var(--decision); } .kt.gotcha { color: var(--gotcha); } .kt.preference { color: var(--preference); } .kt.procedure { color: var(--procedure); }
.stl { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; line-height: 16px; }
.chip { display: inline-flex; align-items: center; font-size: 11.5px; color: var(--ink2); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 20px; }
button.chip:hover { border-color: var(--accent); }
.sh { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 6px; }
.vacio { color: var(--faint); padding: 24px 0; }

/* Memorias: cronología */
.mem { display: grid; grid-template-columns: 230px minmax(0,1fr); height: 100%; }
.rail { border-right: 1px solid var(--line); background: var(--bg2); padding: 8px 10px 20px; overflow-y: auto; }
.ro { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; color: var(--ink2); font-size: 13px; background: none; border: 0; text-align: left; }
.ro:hover { background: var(--panel); }
.ro[aria-pressed=true] { background: var(--sel); color: var(--ink); }
.ro .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ro .n { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.rail select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
.feed { overflow-y: auto; padding: 18px 40px 40px 30px; }
.fhd { color: var(--muted); font-size: 12.5px; margin: 0 0 10px 110px; }
.day { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 0 18px; }
.dl2 { padding-top: 10px; text-align: right; }
.dl2 b { display: block; font: 600 17px var(--serif); color: var(--ink); }
.dl2 span { color: var(--faint); font-size: 11.5px; }
.ev { border-left: 1px solid var(--line2); padding: 0 0 8px 22px; display: flex; flex-direction: column; gap: 6px; }
.plano .ev { border-left: 0; padding-left: 0; }
.row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 14px; padding: 9px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--panel); }
.row::before { content: ""; position: absolute; left: -28px; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line2); }
.plano .row::before { display: none; }
.row.fact::before { border-color: var(--fact); } .row.decision::before { border-color: var(--decision); } .row.gotcha::before { border-color: var(--gotcha); } .row.preference::before { border-color: var(--preference); } .row.procedure::before { border-color: var(--procedure); }
.row .t { font-weight: 500; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
.row .x { grid-column: 1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.proj { font-size: 11.5px; color: var(--ink2); border: 1px solid var(--line2); border-radius: 999px; padding: 0 8px; line-height: 19px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.what { font: 500 10.5px var(--mono); color: var(--faint); }
.what.cambio { color: var(--glow); }
.row.open { cursor: default; background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent); padding: 14px 16px 12px; }
.row.open .t { font: 600 19px/1.3 var(--serif); }
.row.open .x { white-space: normal; }
.row.open .det { grid-column: 1 / span 2; }
.mas { margin: 12px 0 0 110px; }

/* Detalle (en la cronología y en el panel del proyecto) */
.det { margin-top: 8px; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; }
.det.vertical { grid-template-columns: minmax(0,1fr); }
.facts { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 3px 12px; font-size: 12.5px; color: var(--muted); align-content: start; }
.facts b { color: var(--ink2); font-weight: 500; overflow-wrap: anywhere; }
.acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 5px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--delink); border-color: transparent; background: transparent; }
.acts select { background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 5px 8px; font-size: 13px; max-width: 200px; }
.sp { flex: 1; }
.lado { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.versiones, .ultimo { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 14px; }
.ultimo:empty { display: none; }

/* Markdown */
.md { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; color: var(--ink2); overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4 { font: 600 15px/1.3 var(--sans); color: var(--ink); margin: 14px 0 6px; }
.md h1, .md h2 { font: 600 17px/1.3 var(--serif); }
.md strong { color: var(--ink); font-weight: 600; }
.md ul, .md ol { padding-left: 20px; }
.md li { margin: 2px 0; }
.md li::marker { color: var(--accent); }
.md code { font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; color: var(--glow); }
.md pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; color: var(--ink2); }
.md .tabla { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 4px 14px 4px 0; text-align: left; vertical-align: top; }
.md th { color: var(--muted); font-weight: 500; font-size: 12px; }
.md blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .wl { color: var(--glow); }

/* Diff */
.ver { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.ver b { color: var(--ink2); font-weight: 600; }
.diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font: 12px/1.6 var(--mono); background: var(--panel); }
.dl { display: grid; grid-template-columns: 20px minmax(0,1fr); padding: 1px 10px 1px 4px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.dl .s { color: var(--faint); text-align: center; }
.dl.add { background: var(--add); color: var(--ink); } .dl.add .s { color: var(--addink); }
.dl.del { background: var(--del); color: var(--ink2); } .dl.del .s { color: var(--delink); }
.dl.salto { color: var(--faint); }

/* Proyectos */
.pjs { height: 100%; overflow-y: auto; padding: 26px 32px 40px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
.hero h1 { margin: 0; font: 600 30px/1.15 var(--serif); }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.stats { display: flex; gap: 28px; }
.stat b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat span { color: var(--faint); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.card:hover { border-color: var(--accent); }
.card .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card .nm { font: 600 17px var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.card .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.path { font: 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.mix i { display: block; height: 100%; }
.mix .fact { background: var(--fact); } .mix .decision { background: var(--decision); } .mix .gotcha { background: var(--gotcha); } .mix .preference { background: var(--preference); } .mix .procedure { background: var(--procedure); }
.where { border-top: 1px solid var(--line); padding-top: 10px; color: var(--ink2); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.where .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; display: flex; gap: 8px; }
.where .lb span { color: var(--faint); letter-spacing: 0; text-transform: none; font-weight: 400; }
.where.nada { color: var(--faint); font-style: italic; }
.card .where .txt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.leyenda { display: flex; gap: 14px; color: var(--faint); font-size: 11.5px; flex-wrap: wrap; margin-top: 16px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }

/* Página de un proyecto */
.pp { display: grid; grid-template-columns: minmax(0,1fr); height: 100%; }
.pp.con-panel { grid-template-columns: minmax(0,1fr) minmax(360px, 34%); }
.work { overflow-y: auto; padding: 18px 24px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.crumb { color: var(--faint); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--accent); }
.crumb b { color: var(--ink2); font-weight: 500; }
.head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 22px; align-items: start; }
.head h1 { margin: 0 0 6px; font: 600 30px/1.1 var(--serif); overflow-wrap: anywhere; }
.head .where { border-top: 0; padding-top: 0; font-size: 13.5px; }
.head .where .md { margin-top: 4px; max-height: 220px; overflow-y: auto; }
.nums { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(78px, auto); gap: 8px; }
.num { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.num b { display: block; font-size: 20px; font-weight: 600; line-height: 1.1; }
.num span { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 11.5px; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 12px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ch { display: flex; align-items: center; gap: 7px; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
.ch .n { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.mc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.mc:hover { border-color: var(--line2); background: var(--panel2); }
.mc[aria-current=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 18%, transparent); }
.mc .t { font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.mc .m { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; }
.col .ver-mas { background: none; border: 0; color: var(--muted); font-size: 12px; text-align: left; padding: 2px 4px; }
.col .ver-mas:hover { color: var(--accent); }
.panel { border-left: 1px solid var(--line); background: var(--bg2); padding: 18px 22px 30px; overflow-y: auto; min-width: 0; }
.panel h2 { margin: 8px 0 10px; font: 600 22px/1.25 var(--serif); overflow-wrap: anywhere; }
.panel .cerrar { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 13px; }
.panel .cerrar:hover { color: var(--ink); }

/* Conexiones (7.4) */
.grafo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.grafo .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.grafo svg { display: block; width: 100%; height: auto; max-height: 380px; }
.grafo line { stroke: var(--line2); stroke-width: 1.2; }
.grafo circle { stroke: var(--bg); stroke-width: 2; cursor: pointer; }
.grafo circle.fuera { opacity: .55; }
.grafo circle:hover { stroke: var(--accent); }
.grafo text { font: 10.5px var(--sans); fill: var(--muted); pointer-events: none; }
.grafo .fact { fill: var(--fact); } .grafo .decision { fill: var(--decision); } .grafo .gotcha { fill: var(--gotcha); } .grafo .preference { fill: var(--preference); } .grafo .procedure { fill: var(--procedure); }

/* Revisar */
.nav .cuenta { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--sans); text-align: center; }
.rev { height: 100%; overflow-y: auto; padding: 26px 32px 40px; }
.rev .grupo { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.rev .grupo h2 { margin: 0; font: 600 18px var(--serif); }
.rev .grupo .n { color: var(--faint); font-size: 12px; }
.rev .grupo p { margin: 0; color: var(--muted); font-size: 12.5px; }
.av { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.av .cab { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.av .t { font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.av .det2 { color: var(--muted); font-size: 12.5px; }
.av .det2 b { color: var(--glow); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.par { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.par > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.par .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.par .lb.nueva { color: var(--accent); }
.par .md { max-height: 320px; overflow-y: auto; font-size: 13px; }
@media (max-width: 900px) { .par { grid-template-columns: 1fr; } .rev { padding: 18px 14px 30px; } }

#aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 9; }

@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  .mem, .pp, .pp.con-panel { grid-template-columns: 1fr; height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }

async function herramienta(nombre, args) {

/* ---------- Markdown: se escapa todo y luego se da formato; los enlaces solo http(s). ---------- */
function enLinea(s) {
  const codigos = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codigos.push(c); return `\u0000${codigos.length - 1}\u0000`; });
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
       .replace(/\[\[([^\]]+)\]\]/g, '<span class="wl">$1</span>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codigos[i]}</code>`);
}
function md(texto) {
  const l = esc(texto).replace(/\r/g, '').split('\n'), out = [];
  let i = 0;
  const celdas = f => f.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  while (i < l.length) {
    const x = l[i];
    if (/^\s*```/.test(x)) {
      const b = []; i++;
      while (i < l.length && !/^\s*```/.test(l[i])) b.push(l[i++]);
      i++; out.push(`<pre><code>${b.join('\n')}</code></pre>`); continue;
    }
    if (!x.trim()) { i++; continue; }
    let h = x.match(/^(#{1,6})\s+(.*)$/);
    if (h) { const n = Math.min(h[1].length, 4); out.push(`<h${n}>${enLinea(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(x)) { out.push('<hr>'); i++; continue; }
    if (/^\s*\|/.test(x) && i + 1 < l.length && /^\s*\|?\s*:?-{2,}/.test(l[i + 1])) {
      const cab = celdas(x); i += 2; const filas = [];
      while (i < l.length && /^\s*\|/.test(l[i])) filas.push(celdas(l[i++]));
      out.push(`<div class="tabla"><table><thead><tr>${cab.map(c => `<th>${enLinea(c)}</th>`).join('')}</tr></thead><tbody>${filas.map(f => `<tr>${f.map(c => `<td>${enLinea(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^&gt;\s?/.test(x)) {
      const b = [];
      while (i < l.length && /^&gt;\s?/.test(l[i])) b.push(l[i++].replace(/^&gt;\s?/, ''));
      out.push(`<blockquote>${md(b.join('\n').replace(/&gt;/g, '>').replace(/&lt;/g, '<').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&'))}</blockquote>`); continue;
    }
    const lista = x.match(/^\s*([-*+]|\d+[.)])\s+/);
    if (lista) {
      const ord = /\d/.test(lista[1]), items = [];
      while (i < l.length && /^\s*([-*+]|\d+[.)])\s+/.test(l[i])) {
        let it = l[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        while (i < l.length && /^\s{2,}\S/.test(l[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(l[i])) it += ' ' + l[i++].trim();
        items.push(`<li>${enLinea(it)}</li>`);
      }
      out.push(ord ? `<ol>${items.join('')}</ol>` : `<ul>${items.join('')}</ul>`); continue;
    }
    const p = [];
    while (i < l.length && l[i].trim() && !/^\s*(```|#{1,6}\s|\||&gt;|([-*+]|\d+[.)])\s+)/.test(l[i])) p.push(enLinea(l[i++]));
    if (p.length) out.push(`<p>${p.join('<br>')}</p>`); else out.push(`<p>${enLinea(l[i++])}</p>`);
  }
  return out.join('');
}
const extracto = s => String(s || '').replace(/```[\s\S]*?```/g, ' ').replace(/[#>*`|_\[\]]/g, '').replace(/\s+/g, ' ').trim().slice(0, 220);

/* ---------- Diff por líneas (LCS), con una línea de contexto. ---------- */
function diff(a, b) {
  const x = a.split('\n'), y = b.split('\n'), n = x.length, m = y.length;
  if (n * m > 4e6) return [...x.map(t => ['del', t]), ...y.map(t => ['add', t])];
  const L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = x[i] === y[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (x[i] === y[j]) { ops.push(['', x[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) ops.push(['del', x[i++]]);
    else ops.push(['add', y[j++]]);
  }
  while (i < n) ops.push(['del', x[i++]]);
  while (j < m) ops.push(['add', y[j++]]);
  // Se quedan los cambios y una línea a cada lado; cada tramo igual que sobra se resume en «⋯».
  const cerca = k => [k - 1, k, k + 1].some(q => ops[q] && ops[q][0]);
  const r = [];
  ops.forEach((o, k) => {
    if (cerca(k)) r.push(o);
    else if (!r.length || r[r.length - 1][0] !== 'salto') r.push(['salto', '']);
  });
  return r;
}
function diffHTML(antes, despues) {
  const ops = [];
  if (antes.title !== despues.title) ops.push(['del', `# ${antes.title}`], ['add', `# ${despues.title}`], ['salto', '']);
  for (const o of diff(antes.content || '', despues.content || '')) if (o[0] !== 'salto' || !ops.length || ops[ops.length - 1][0] !== 'salto') ops.push(o);
  const s = { add: '+', del: '−', salto: '⋯', '': ' ' };
  return `<div class="diff">${ops.map(([c, t]) => `<div class="dl ${c}"><span class="s">${s[c]}</span><span>${c === 'salto' ? '' : esc(t) || ' '}</span></div>`).join('')}</div>`;
}
// Los cambios de una memoria, del más reciente al más antiguo: [{antes, despues, cuando, motivo, de, a}].
function cambios(m, versiones) {
  const v = [...versiones].sort((p, q) => p.version - q.version), r = [];
  for (let k = 0; k < v.length; k++) {
    const despues = k + 1 < v.length ? v[k + 1] : m;
    r.push({ antes: v[k], despues, cuando: v[k].changed_at, motivo: v[k].reason, de: v[k].version, a: v[k].version + 1 });
  }
  return r.reverse();
}

}

}

async function sincro() {

/* ---------- Rutas: #/ (memorias), #/proyectos, #/proyecto/<carpeta> ---------- */
function ruta() {

  return { vista: 'memorias' };
}
const enlaceProyecto = p => '#/proyecto/' + encodeURIComponent(p || '@global');

function pintar() {
  const r = ruta();
  $('nav-mem').setAttribute('aria-current', r.vista === 'memorias' ? 'page' : 'false');

/* ---------- Memorias: cronología por días ---------- */
function eventos() {
  if (encontrados) return encontrados.map(id => todas.find(m => m.id === id)).filter(m => m && pasa(m))
    .map(m => ({ m, at: m.updated_at, que: queFue(m) }));
  const ev = [];
  for (const m of todas) {
    if (!pasa(m)) continue;
    ev.push({ m, at: m.updated_at, que: queFue(m) });
    if (filtro.recordado && m.recalled_at) ev.push({ m, at: m.recalled_at, que: { txt: T.recordadaEv, cls: '' }, rec: true });
  }
  return ev.sort((a, b) => b.at.localeCompare(a.at));
}
function queFue(m) {
  if (!m.versions && m.created_at === m.updated_at) return { txt: T.nueva, cls: '' };
  return { txt: `${T.cambiada}${m.versions ? ' · v' + (m.versions + 1) : ''}`, cls: 'cambio' };
}
const claveEv = e => e.m.id + (e.rec ? ':r' : '');

// Las memorias del proyecto en un anillo y las que enlazan de fuera (globales u otros proyectos) en
// otro, con una línea por enlace. Sin librerías; solo si hay algún enlace.
function grafoHTML(ms) {
  // Solo las que tienen algún enlace; con muchas, las etiquetas salen al pasar el ratón.
  const conEnlace = m => (m.links || []).length || enlazan(m).length;
  const dentro = ms.filter(conEnlace).slice(0, 24), ids = new Set(dentro.map(m => m.id)), fuera = new Map(), aristas = [];
  for (const m of dentro) {
    for (const id of m.links || []) { aristas.push([m.id, id]); if (!ids.has(id)) fuera.set(id, true); }
    for (const x of enlazan(m)) { if (!ids.has(x.id)) { aristas.push([x.id, m.id]); fuera.set(x.id, true); } }
  }
  if (!aristas.length) return '';
  const externas = [...fuera.keys()].slice(0, 20).map(id => todas.find(x => x.id === id)).filter(Boolean);
  const total = dentro.length + externas.length, etiquetas = total <= 14;
  const W = 760, H = total > 20 ? 420 : 320, cx = W / 2, cy = H / 2, pos = new Map();
  const anillo = (lista, rx, ry) => lista.forEach((m, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, lista.length); pos.set(m.id, [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); });
  const r1 = dentro.length > 1 ? Math.min(150, 40 + dentro.length * 6) : 0;
  anillo(dentro, r1 * 1.6, r1 * 0.8);
  anillo(externas, Math.min(W / 2 - 40, r1 * 1.6 + 120), Math.min(H / 2 - 24, r1 * 0.8 + 70));
  const lineas = aristas.filter(([a, b]) => pos.has(a) && pos.has(b)).map(([a, b]) => { const [x1, y1] = pos.get(a), [x2, y2] = pos.get(b); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"></line>`; }).join('');
  const nodo = (m, de) => { const [x, y] = pos.get(m.id); return `<circle class="${m.kind}${de ? '' : ' fuera'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${de ? 8 : 6}" data-ir="${m.id}"><title>${esc(m.title)}</title></circle>` + (etiquetas ? `<text x="${(x + 11).toFixed(1)}" y="${(y + 4).toFixed(1)}">${esc(m.title.slice(0, 28))}</text>` : ''); };
  return `<div class="grafo"><div class="lb">${T.conexiones} · ${dentro.length + externas.length}</div><svg viewBox="0 0 ${W} ${H}" role="img">${lineas}${dentro.map(m => nodo(m, true)).join('')}${externas.map(m => nodo(m, false)).join('')}</svg></div>`;
}

function pintarProyecto(p) {
  const ms = delProyecto(p).filter(m => !encontrados || encontrados.includes(m.id)), e = estados()[p];
  const ordenadas = encontrados ? encontrados.map(id => ms.find(m => m.id === id)).filter(Boolean) : ms;
  const m = elegidaPanel && todas.find(x => x.id === elegidaPanel && x.project === p);
  const cols = tiposDe(ms).map(t => {
    const v = ordenadas.filter(x => x.kind === t), todasCol = columnasAbiertas[p + t], vis = todasCol ? v : v.slice(0, POR_COLUMNA);
    return `<div class="col">
      <div class="ch"><i class="k ${t}"></i><span class="kt ${t}">${t}</span><span class="n">${v.length}</span></div>
      ${vis.map(x => `<button class="mc" data-id="${x.id}" aria-current="${m && m.id === x.id}"><span class="t">${x.pinned ? '◆ ' : ''}${esc(x.title)}</span><span class="m">${esc(corta(x.updated_at))}${x.tags.includes(ESTADO) ? ' <span class="stl">status</span>' : ''}</span></button>`).join('')}
      ${v.length > POR_COLUMNA ? `<button class="ver-mas" data-col="${t}">${todasCol ? T.menos : T.masN(v.length - POR_COLUMNA)}</button>` : ''}
    </div>`;
  }).join('');
  $('vista').innerHTML = `<div class="pp${m ? ' con-panel' : ''}">
    <div class="work">
      <div class="crumb"><a href="#/proyectos">${T.proyectos}</a><span>›</span><b>${esc(nombre(p))}</b><span class="mono">${esc(p)}</span></div>
      <div class="head">
        <div>
          <h1>${esc(nombre(p))}</h1>
          ${e ? `<div class="where"><div class="lb">${T.donde} <span>${esc(corta(e.updated_at))}</span></div><div class="md">${md(e.content)}</div></div>` : `<div class="where nada">${T.sinEstado}</div>`}
        </div>
        <div class="nums">${tiposDe(ms).map(t => `<div class="num"><b>${ms.filter(x => x.kind === t).length}</b><span><i class="k ${t}"></i>${t}</span></div>`).join('')}</div>
      </div>
      ${grafoHTML(ms)}
      ${ms.length ? `<div class="cols">${cols}</div>` : `<p class="vacio">${T.nada}</p>`}
    </div>
    ${m ? `<aside class="panel" id="panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="kt ${m.kind}">${m.kind}</span>${m.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join('')}<button class="cerrar" id="cerrar">Esc ✕</button></div>
      <h2>${m.pinned ? '◆ ' : ''}${esc(m.title)}</h2>
      ${detalleHTML(m, true)}
    </aside>` : ''}
  </div>`;
  const v = $('vista');
  for (const b of v.querySelectorAll('.mc')) b.onclick = () => { elegidaPanel = elegidaPanel === b.dataset.id ? null : b.dataset.id; pintar(); };
  for (const b of v.querySelectorAll('[data-col]')) b.onclick = () => { columnasAbiertas[p + b.dataset.col] = !columnasAbiertas[p + b.dataset.col]; pintar(); };
  for (const c of v.querySelectorAll('.grafo [data-ir]')) c.onclick = () => irA(c.dataset.ir);
  if (m) { $('cerrar').onclick = () => { elegidaPanel = null; pintar(); }; conectar($('panel'), m); }
}

/* ---------- Búsqueda, rutas y teclado ---------- */
let espera;
$('q').oninput = () => {
  clearTimeout(espera);
  espera = setTimeout(async () => {
    consulta = $('q').value.trim();
    if (!consulta) { encontrados = null; pintar(); return; }
    const r = ruta();
    if (r.vista === 'proyectos') location.hash = '#/';
    try {
      const v = await herramienta('search', { query: consulta, limit: 50, all_projects: true });
      encontrados = v.map(x => x.id);
    } catch (e) { aviso(T.error + ': ' + e.message); encontrados = []; }
    abierta = null; pagina = 1; pintar();
  }, 180);
};
window.addEventListener('hashchange', () => { elegidaPanel = irPendiente; irPendiente = null; pintar(); $('vista').firstElementChild?.querySelector('.feed,.work,.pjs')?.scrollTo(0, 0); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  const r = ruta();
  if (e.key === 'Escape') {
    if (r.vista === 'proyecto' && elegidaPanel) { elegidaPanel = null; pintar(); }
    else if (r.vista === 'memorias' && abierta) { abierta = null; pintar(); }
    return;
  }
  if (r.vista === 'memorias' && ['j', 'k', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const filas = [...document.querySelectorAll('.row')], i = filas.findIndex(f => f.dataset.ev === abierta);
    const sig = filas[Math.max(0, Math.min(filas.length - 1, i + ((e.key === 'j' || e.key === 'ArrowDown') ? 1 : -1)))];
    if (sig) abrir(sig.dataset.ev);
  }
});
document.documentElement.lang = ES ? 'es' : 'en';
$('nav-mem').textContent = T.memorias;
$('nav-pj').textContent = T.proyectos;
$('nav-rev').firstElementChild.textContent = T.revisar;
cargar();
</script>
