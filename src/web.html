<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="omoikane-view" content="__OMOIKANE_VIEW__">
<title>Omoikane</title>
<link rel="icon" href="/icono.png">
<style>
/* Fonts inside the binary (OFL, assets/fonts): the view works without internet. */
@font-face { font-family: "IBM Plex Sans"; font-weight: 100 700; font-display: swap; src: url(/fuentes/plex-sans.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(/fuentes/plex-mono-400.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 600; font-display: swap; src: url(/fuentes/plex-mono-600.woff2) format("woff2"); }
@font-face { font-family: "Shippori Mincho"; font-weight: 600; font-display: swap; src: url(/fuentes/shippori-600.woff2) format("woff2"); }
@font-face { font-family: "Shippori Mincho"; font-weight: 600; font-display: swap; src: url(/fuentes/shippori-600-omoikane.woff2) format("woff2"); unicode-range: U+517C, U+601D; }

/* Banner palette: warm black, copper and amber, cream. In light mode, warm paper and dark copper. */
:root {
  --bg: #0d0a08; --bg2: #120e0b; --panel: #18120e; --panel2: #201812; --line: #2f241b; --line2: #3d2f23;
  --ink: #f2e3cc; --ink2: #d9c6aa; --muted: #a8937b; --faint: #93806a;
  --accent: #e2894a; --glow: #f4b878; --accent-ink: #1a0f07; --sel: rgba(226,137,74,.13);
  --fact: oklch(0.78 0.09 235); --decision: oklch(0.78 0.09 305); --gotcha: oklch(0.78 0.09 35); --preference: oklch(0.78 0.09 150); --procedure: oklch(0.78 0.09 85);
  --add: rgba(110,190,130,.16); --addink: oklch(0.82 0.11 150); --del: rgba(226,96,74,.16); --delink: oklch(0.78 0.12 30);
  --shadow: 0 12px 32px rgba(0,0,0,.35); --halo: rgba(244,184,120,.25);
  --sans: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif; --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --serif: "Shippori Mincho", "Yu Mincho", Georgia, serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f5eee3; --bg2: #efe6d8; --panel: #fbf7f0; --panel2: #f4ecdf; --line: #e2d5c1; --line2: #d3c2a9;
    --ink: #23180f; --ink2: #3b2c1f; --muted: #6e5b47; --faint: #7a6652;
    --accent: #a4481c; --glow: #b0541c; --accent-ink: #fff8ef; --sel: rgba(164,72,28,.09);
    --fact: oklch(0.50 0.10 235); --decision: oklch(0.50 0.10 305); --gotcha: oklch(0.50 0.10 35); --preference: oklch(0.50 0.10 150); --procedure: oklch(0.50 0.10 85);
    --add: rgba(40,140,80,.12); --addink: oklch(0.45 0.11 150); --del: rgba(190,60,30,.11); --delink: oklch(0.48 0.13 30);
    --shadow: 0 1px 2px rgba(60,30,10,.06), 0 8px 24px rgba(60,30,10,.07); --halo: rgba(176,84,28,.12);
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
input, select, button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
a:hover { color: var(--glow); }
code, .mono { font-family: var(--mono); }
.serif { font-family: var(--serif); font-weight: 600; }
[hidden] { display: none !important; }

/* Header */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--bg2); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand img { width: 30px; height: 30px; border-radius: 50%; box-shadow: 0 0 0 1px var(--line2), 0 0 18px var(--halo); }
.word { font: 600 19px/1 var(--serif); letter-spacing: .01em; }
.word .kj { color: var(--glow); margin-right: 6px; }
.nav { display: flex; gap: 2px; min-width: 0; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 13.5px; white-space: nowrap; }
@media (max-width: 480px) { .nav { flex-wrap: wrap; overflow: visible; row-gap: 4px; } .nav a { padding: 6px 7px; font-size: 13px; } .nav .cuenta { margin-left: 4px; } }
.nav a[aria-current=page] { background: var(--panel2); color: var(--ink); box-shadow: 0 0 0 1px var(--line2); }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; padding: 8px 2px; }
.search input::placeholder { color: var(--muted); }
.kbd { font: 500 11px var(--mono); color: var(--muted); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--preference); }
.pill.mal { color: var(--delink); } .pill.mal .dot { background: var(--delink); }
/* Where it is viewed from: the space the server shows (or all). */
.pill.alc { color: var(--ink2); border-color: var(--line2); } .pill.alc .dot { background: var(--accent); border-radius: 2px; transform: rotate(45deg); }
main { flex: 1; min-height: 0; position: relative; }

/* Kinds */
.k { width: 8px; height: 8px; border-radius: 2px; flex: none; transform: rotate(45deg); display: inline-block; background: var(--faint); }
.k.fact { background: var(--fact); } .k.decision { background: var(--decision); } .k.gotcha { background: var(--gotcha); } .k.preference { background: var(--preference); } .k.procedure { background: var(--procedure); }
.k.pin { background: var(--glow); border-radius: 50%; transform: none; }
.kt { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kt.fact { color: var(--fact); } .kt.decision { color: var(--decision); } .kt.gotcha { color: var(--gotcha); } .kt.preference { color: var(--preference); } .kt.procedure { color: var(--procedure); }
.stl { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--line2); border-radius: 4px; padding: 0 5px; line-height: 16px; }
.vf { color: var(--accent); font-weight: 700; }
.ded { color: var(--faint); font-weight: 700; cursor: help; }
.espera { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); font: 600 10px/16px var(--mono); letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px; cursor: help; }
.evid { font-style: normal; font-weight: 400; color: var(--muted); }
.chip { display: inline-flex; align-items: center; font-size: 11.5px; color: var(--ink2); background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; line-height: 20px; }
button.chip:hover { border-color: var(--accent); }
.sh { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 10px 8px 6px; }
.vacio { color: var(--faint); padding: 24px 0; }
.enlace-mal { max-width: 640px; margin: 48px auto; padding: 0 20px; color: var(--ink2); line-height: 1.55; overflow-wrap: anywhere; }

/* Memories: timeline */
.mem { display: grid; grid-template-columns: 230px minmax(0,1fr); height: 100%; }
.rail { border-right: 1px solid var(--line); background: var(--bg2); padding: 8px 10px 20px; overflow-y: auto; }
.ro { display: flex; width: 100%; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; color: var(--ink2); font-size: 13px; background: none; border: 0; text-align: left; }
.ro:hover { background: var(--panel); }
.ro[aria-pressed=true] { background: var(--sel); color: var(--ink); }
.ro .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ro .n { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.rail select { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 13px; }
.feed { overflow-y: auto; padding: 18px 40px 40px 30px; }
.fhd { color: var(--muted); font-size: 12.5px; margin: 0 0 10px 110px; }
.day { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 0 18px; }
.dl2 { padding-top: 10px; text-align: right; }
.dl2 b { display: block; font: 600 17px var(--serif); color: var(--ink); }
.dl2 span { color: var(--faint); font-size: 11.5px; }
.ev { border-left: 1px solid var(--line2); padding: 0 0 8px 22px; display: flex; flex-direction: column; gap: 6px; }
.plano .ev { border-left: 0; padding-left: 0; }
.row { position: relative; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 14px; padding: 9px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.row:hover { background: var(--panel); }
.row::before { content: ""; position: absolute; left: -28px; top: 15px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line2); }
.plano .row::before { display: none; }
.row.fact::before { border-color: var(--fact); } .row.decision::before { border-color: var(--decision); } .row.gotcha::before { border-color: var(--gotcha); } .row.preference::before { border-color: var(--preference); } .row.procedure::before { border-color: var(--procedure); }
.row .t { font-weight: 500; color: var(--ink); line-height: 1.35; overflow-wrap: anywhere; }
.row .x { grid-column: 1; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.proj { font-size: 11.5px; color: var(--ink2); border: 1px solid var(--line2); border-radius: 999px; padding: 0 8px; line-height: 19px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; text-decoration: none; white-space: nowrap; }
.proj .pe { color: var(--faint); }
.proj.esp { border-style: dashed; color: var(--glow); }
.proj.esp::before { content: "◇ "; }
.proj.glob { color: var(--muted); }
.what { font: 500 10.5px var(--mono); color: var(--faint); }
.what.cambio { color: var(--glow); }
.row.open { cursor: default; background: var(--panel); border-color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 30px color-mix(in srgb, var(--accent) 12%, transparent); padding: 14px 16px 12px; }
.row.open .t { font: 600 19px/1.3 var(--serif); }
.row.open .x { white-space: normal; }
.row.open .det { grid-column: 1 / span 2; }
.mas { margin: 12px 0 0 110px; }

/* Detail (in the timeline and in the project panel) */
.det { margin-top: 8px; display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 16px; }
.det.vertical { grid-template-columns: minmax(0,1fr); }
.facts { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 3px 12px; font-size: 12.5px; color: var(--muted); align-content: start; }
.facts b { color: var(--ink2); font-weight: 500; overflow-wrap: anywhere; }
.acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink2); background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 5px 12px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.danger { color: var(--delink); border-color: transparent; background: transparent; }
.acts select { background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 5px 8px; font-size: 13px; max-width: 200px; }
.sp { flex: 1; }
.lado { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.versiones, .ultimo { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 14px; }
.ultimo:empty { display: none; }

/* Markdown */
.md { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; color: var(--ink2); overflow-wrap: anywhere; min-width: 0; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4 { font: 600 15px/1.3 var(--sans); color: var(--ink); margin: 14px 0 6px; }
.md h1, .md h2 { font: 600 17px/1.3 var(--serif); }
.md strong { color: var(--ink); font-weight: 600; }
.md ul, .md ol { padding-left: 20px; }
.md li { margin: 2px 0; }
.md li::marker { color: var(--accent); }
.md code { font-size: 12.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; color: var(--glow); }
.md pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; color: var(--ink2); }
.md .tabla { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 13px; }
.md th, .md td { border-bottom: 1px solid var(--line); padding: 4px 14px 4px 0; text-align: left; vertical-align: top; }
.md th { color: var(--muted); font-weight: 500; font-size: 12px; }
.md blockquote { border-left: 2px solid var(--accent); padding-left: 12px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }
.md .wl { color: var(--glow); }

/* Diff */
.ver { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.ver b { color: var(--ink2); font-weight: 600; }
.diff { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font: 12px/1.6 var(--mono); background: var(--panel); }
.dl { display: grid; grid-template-columns: 20px minmax(0,1fr); padding: 1px 10px 1px 4px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
.dl .s { color: var(--faint); text-align: center; }
.dl.add { background: var(--add); color: var(--ink); } .dl.add .s { color: var(--addink); }
.dl.del { background: var(--del); color: var(--ink2); } .dl.del .s { color: var(--delink); }
.dl.salto { color: var(--faint); }

/* Projects */
.pjs { height: 100%; overflow-y: auto; padding: 26px 32px 40px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 18px; }
.hero h1 { margin: 0; font: 600 30px/1.15 var(--serif); }
.hero p { margin: 6px 0 0; color: var(--muted); max-width: 64ch; }
.stats { display: flex; gap: 28px; }
.stat b { display: block; font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat span { color: var(--faint); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.card:hover { border-color: var(--accent); }
.card .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card .nm { font: 600 17px var(--serif); color: var(--ink); overflow-wrap: anywhere; }
.card .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.path { font: 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mix { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; }
.mix i { display: block; height: 100%; }
.mix .fact { background: var(--fact); } .mix .decision { background: var(--decision); } .mix .gotcha { background: var(--gotcha); } .mix .preference { background: var(--preference); } .mix .procedure { background: var(--procedure); }
.where { border-top: 1px solid var(--line); padding-top: 10px; color: var(--ink2); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.where .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; display: flex; gap: 8px; }
.where .lb span { color: var(--faint); letter-spacing: 0; text-transform: none; font-weight: 400; }
.where.nada { color: var(--faint); font-style: italic; }
.card .where .txt { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.leyenda { display: flex; gap: 14px; color: var(--faint); font-size: 11.5px; flex-wrap: wrap; margin-top: 16px; }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }

/* Projects grouped by space */
.gsp { display: flex; align-items: baseline; gap: 12px; margin: 26px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.gsp:first-of-type { margin-top: 6px; }
.gsp h2 { margin: 0; font: 600 21px/1.2 var(--serif); }
.gsp h2.esp::before { content: "◇ "; color: var(--glow); }
.gsp span { color: var(--faint); font-size: 12.5px; }
.card.esp { border-style: dashed; }
.card .ido, .crumb .ido { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--delink); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
.cmd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 600px) { .pjs { padding: 18px 14px 30px; } .grid { grid-template-columns: minmax(0,1fr); } }
.cmd code { font-size: 12.5px; background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; color: var(--glow); overflow-wrap: anywhere; }

/* A project's page */
.pp { display: grid; grid-template-columns: minmax(0,1fr); height: 100%; }
.pp.con-panel { grid-template-columns: minmax(0,1fr) minmax(360px, 34%); }
.work { overflow-y: auto; padding: 18px 24px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.crumb { color: var(--faint); font-size: 12.5px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.crumb a { color: var(--muted); text-decoration: none; } .crumb a:hover { color: var(--accent); }
.crumb b { color: var(--ink2); font-weight: 500; }
.head { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 22px; align-items: start; }
.head h1 { margin: 0 0 6px; font: 600 30px/1.1 var(--serif); overflow-wrap: anywhere; }
.head .where { border-top: 0; padding-top: 0; font-size: 13.5px; }
.head .where .md { margin-top: 4px; max-height: 220px; overflow-y: auto; }
.nums { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(78px, auto); gap: 8px; }
.num { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.num b { display: block; font-size: 20px; font-weight: 600; line-height: 1.1; }
.num span { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 11.5px; }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0,1fr); gap: 12px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ch { display: flex; align-items: center; gap: 7px; padding: 0 2px 6px; border-bottom: 1px solid var(--line); }
.ch .n { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.mc { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.mc:hover { border-color: var(--line2); background: var(--panel2); }
.mc[aria-current=true] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px color-mix(in srgb, var(--accent) 18%, transparent); }
.mc .t { font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--ink); overflow-wrap: anywhere; }
.mc .m { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size: 11.5px; }
.col .ver-mas { background: none; border: 0; color: var(--muted); font-size: 12px; text-align: left; padding: 2px 4px; }
.col .ver-mas:hover { color: var(--accent); }
.panel { border-left: 1px solid var(--line); background: var(--bg2); padding: 18px 22px 30px; overflow-y: auto; min-width: 0; }
.panel h2 { margin: 8px 0 10px; font: 600 22px/1.25 var(--serif); overflow-wrap: anywhere; }
.panel .cerrar { margin-left: auto; background: none; border: 0; color: var(--faint); font-size: 13px; }
.panel .cerrar:hover { color: var(--ink); }

/* Connections (7.4) */
.grafo { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.grafo .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.grafo svg { display: block; width: 100%; height: auto; max-height: 380px; }
.grafo line { stroke: var(--line2); stroke-width: 1.2; }
.grafo circle { stroke: var(--bg); stroke-width: 2; cursor: pointer; }
.grafo circle.fuera { opacity: .55; }
.grafo circle:hover { stroke: var(--accent); }
.grafo text { font: 10.5px var(--sans); fill: var(--muted); pointer-events: none; }
.grafo .fact { fill: var(--fact); } .grafo .decision { fill: var(--decision); } .grafo .gotcha { fill: var(--gotcha); } .grafo .preference { fill: var(--preference); } .grafo .procedure { fill: var(--procedure); }

/* Review */
.trozo { margin: 12px 0 0; }
.trozo .titulo-trozo { width: 100%; box-sizing: border-box; margin: 6px 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); color: var(--ink); font: 600 13.5px var(--sans); }
.trozo .cuenta-trozo.mal { color: var(--delink); font-weight: 600; }
.nav .cuenta.neutra { background: var(--line2); color: var(--ink2); }
.nav .cuenta { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--sans); text-align: center; }
.rev { height: 100%; overflow-y: auto; padding: 26px 32px 40px; }
.rev .grupo { margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.rev .grupo h2 { margin: 0; font: 600 18px var(--serif); }
.rev .grupo .n { color: var(--faint); font-size: 12px; }
.rev .grupo p { margin: 0; color: var(--muted); font-size: 12.5px; }
.av { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.av .cab { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.av .t { font-weight: 500; color: var(--ink); overflow-wrap: anywhere; }
.av .det2 { color: var(--muted); font-size: 12.5px; }
.av .det2 b { color: var(--glow); font-weight: 600; font-family: var(--mono); font-size: 12px; }
.av .det2.quien { color: var(--faint); font-style: italic; }
.par { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; }
.par > div { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.par .lb { font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.par .lb.nueva { color: var(--accent); }
.par .md { max-height: 320px; overflow-y: auto; font-size: 13px; }
.par .lb.espera-lb { color: var(--delink); }
.par .elegir { align-self: flex-start; margin-top: 4px; }
.av .motivo-con { width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 13px var(--sans); }
.av textarea.fusion { width: 100%; min-height: 220px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
.abiertas { margin-bottom: 22px; }
.blk { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--delink); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
.blk.later { color: var(--faint); }
.fl .blk { margin-left: 6px; }
.abiertas .av.bloq { border-color: color-mix(in srgb, var(--delink) 55%, var(--line)); }
.abiertas .av textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line2); border-radius: 9px; padding: 8px 10px; font-size: 13px; line-height: 1.45; }
@media (max-width: 900px) { .par { grid-template-columns: 1fr; } .rev { padding: 18px 14px 30px; } }

/* Overview: the manager view, by space */
.pan { height: 100%; overflow-y: auto; padding: 26px 32px 40px; }
.pan .ctl { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.pan .ctl select { background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.alcance { color: var(--faint); font-size: 12.5px; margin: -6px 0 6px; }
.tres { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: start; }
.blq { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.blq > h3 { margin: 0; font: 600 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); display: flex; gap: 8px; align-items: baseline; }
.blq > h3 span { margin-left: auto; color: var(--faint); letter-spacing: 0; text-transform: none; font-weight: 400; }
.blq .sub { font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); border-top: 1px solid var(--line); padding-top: 9px; display: flex; gap: 8px; }
.blq .sub span { margin-left: auto; letter-spacing: 0; }
.lst { display: flex; flex-direction: column; gap: 2px; }
.fl { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1px 10px; padding: 5px 6px; border-radius: 8px; text-align: left; background: none; border: 0; color: inherit; text-decoration: none; }
a.fl:hover, button.fl:hover { background: var(--panel2); }
.fl .t { font-size: 13px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl .d { grid-column: 1 / -1; color: var(--faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl .d.dos { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--muted); }
.fl .n { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.fl .ido, .fl .pz { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--delink); border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; line-height: 16px; margin-left: 6px; }
.fl .pz { color: var(--glow); }
.aut { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 3px 10px; padding: 5px 6px; }
.aut .nm { font-size: 13px; font-weight: 500; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aut .nm.anon { color: var(--muted); font-style: italic; font-weight: 400; }
.aut .n { color: var(--muted); font-size: 12px; white-space: nowrap; }
.aut .barra { grid-column: 1 / -1; display: block; height: 5px; border-radius: 3px; background: var(--panel2); overflow: hidden; }
.aut .barra i { display: block; height: 100%; background: var(--accent); opacity: .75; }
.aut .ag { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--faint); font-size: 11.5px; }
.aut .ag code { font-size: 11px; color: var(--ink2); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.cuentas { display: flex; flex-wrap: wrap; gap: 6px; }
.cuentas .chip b { color: var(--glow); margin-left: 5px; font-weight: 600; }
.blq .cmd code { font-size: 11.5px; padding: 2px 7px; }
.blq .cmd .btn { font-size: 12px; padding: 2px 9px; }
.blq .vacio { padding: 2px 6px; font-size: 12.5px; }
@media (max-width: 1100px) { .tres { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 700px) { .tres { grid-template-columns: minmax(0,1fr); } .pan { padding: 18px 14px 30px; } }

#aviso { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 9; }

@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  .mem, .pp, .pp.con-panel { grid-template-columns: minmax(0,1fr); height: auto; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 40vh; }
  .feed { padding: 14px 14px 30px; overflow: visible; }
  .day { grid-template-columns: 1fr; }
  .dl2 { text-align: left; display: flex; gap: 8px; align-items: baseline; padding: 6px 0; }
  .ev { border-left: 0; padding-left: 0; }
  .row::before { display: none; }
  .fhd, .mas { margin-left: 0; }
  .det { grid-template-columns: minmax(0,1fr); }
  .cols { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0,1fr)); }
  .nums { grid-auto-flow: row; grid-template-columns: repeat(3, minmax(0,1fr)); }
  .head { grid-template-columns: minmax(0,1fr); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
}

  if (h === 'papelera') return { vista: 'papelera' };
  if (h === 'panorama') return { vista: 'panorama' };

  const list = document.querySelector('#vista > .rev'), keepScroll = list && renderedView === r.vista ? list.scrollTop : null;

    if (p.length <= CHUNK_CHARS) { pieces.push(p); continue; }
    let current = '';
    for (const l of p.split('\n').flatMap(l => l.length <= CHUNK_CHARS ? [l] : l.split(/(?<=[.!?])\s+/))) {
      if (current && current.length + l.length + 1 > CHUNK_CHARS) { pieces.push(current); current = ''; }
      current = current ? current + '\n' + l : l;
    }
    if (current) pieces.push(current);
  }
  const startsSection = p => /^(#{1,6}\s|\*\*[^*\n]{2,})/.test(p.trimStart());
  const chunks = [];
  let current = '';
  for (const p of pieces) {
    const full = current && current.length + p.length + 2 > CHUNK_CHARS;
    const goodCut = current && startsSection(p) && current.length > CHUNK_CHARS * 0.6;
    if (full || goodCut) { chunks.push(current); current = ''; }
    current = current ? current + '\n\n' + p : p;
  }
  if (current) chunks.push(current);
  // The original's topic, without what follows its first «;», «(», «:» or dash: the new chunks carry
  // it before their own title, which otherwise got very long.
  const topic0 = m.title.split(/[;(:—–]/)[0].trim() || m.title;
  const n = chunks.length, base = topic0.length > 60 ? topic0.slice(0, 59) + '…' : topic0;
  return chunks.map((content, i) => {
    if (i === 0) return { title: m.title, content };
    // If the chunk starts with a heading, that says what it is about; if not, the original's with its number.
    const headingMatch = content.trimStart().split('\n')[0].match(/^(?:#{1,6}\s+|\*\*)(.+?)(?:\*\*.*)?$/);
    const topic = headingMatch ? headingMatch[1].replace(/[*:]+$/, '').trim().slice(0, 80) : '';
    return { title: topic ? `${base}: ${topic}` : `${base} (${i + 1}/${n})`, content };
  });
}

// The links in the warning (`links to nothing: [[a]], [[b]]`) that are still written in the memory.
function brokenLinks(a, m) {
  return [...new Set([...a.detail.matchAll(/\[\[([^\]]+)\]\]/g)].map(x => x[1]))].filter(l => m && m.content.includes(`[[${l}]]`));
}
function warningHTML(a) {
  const m = memories.find(x => x.id === a.memory_id), o = a.other_id && memories.find(x => x.id === a.other_id), isOpen = reviewOpen[warningKey(a)];
  if (!m) return '';
  const row = x => `${scopePill(scopeOf(x))} <span class="kt ${x.kind}">${x.kind}</span> <span class="what">${esc(shortWhen(x.updated_at))}</span>`;
  // Merge (0.19.0): in a pair, the newer one absorbs the older; in «they disagree» the date decides.
  const mergeable = o && ['outdated', 'trade_duplicate', 'superseded', 'contradicts'].includes(a.kind);
  const [newer, older] = !o ? [null, null] : a.kind === 'contradicts' && m.updated_at > o.updated_at ? [m, o] : [o, m];
  const merging = mergeable && reviewMerge[warningKey(a)];
  // The [[links]] that lead nowhere, for «Remove the link» (only those still in the text).
  const broken = a.kind === 'broken_link' ? brokenLinks(a, m) : [];
  const pairHTML = !o ? '' : `<div class="par">
      <div><span class="lb">${esc(a.kind === 'superseded' ? T.sustituida : a.kind === 'contradicts' ? T.unaEt : T.vieja)}</span><span class="t">${esc(m.title)}</span><div class="md">${md(m.content)}</div></div>
      <div><span class="lb nueva">${esc(a.kind === 'superseded' ? T.sustituta : a.kind === 'contradicts' ? T.otraEt : T.nuevaEt)}</span><span class="t">${esc(o.title)}</span><div class="md">${md(o.content)}</div></div>
    </div>`;
  let inner = '';
  const splitting = a.kind === 'too_long' && reviewSplit[warningKey(a)];
  if (splitting) inner = `<p class="vacio" style="padding:6px 0 0">${esc(T.partirSub(splitting.length))}</p>
    ${splitting.map((t, i) => `<div class="trozo" data-i="${i}">
      <div class="cab"><span class="lb">${esc(i === 0 ? T.trozoQueda : T.trozoNuevo(i + 1))}</span><span class="what cuenta-trozo${t.content.length > RECALL_CHARS ? ' mal' : ''}">${esc(T.caracteres(t.content.length))}</span></div>
      <input class="titulo-trozo" value="${esc(t.title)}" spellcheck="false">
      <textarea class="fusion" rows="10" spellcheck="false">${esc(t.content)}</textarea>
    </div>`).join('')}`;
  else if (merging) inner = `${pairHTML}
    <p class="vacio" style="padding:6px 0 0">${esc(T.juntarSub)}</p>
    <textarea class="fusion" rows="12" spellcheck="false">${esc(newer.content + '\n\n' + older.content)}</textarea>`;
  else if (isOpen && o) inner = pairHTML;
  else if (isOpen) inner = `<div class="md" style="max-height:360px;overflow-y:auto">${md(m.content)}</div>`;
  return `<div class="av" data-k="${esc(warningKey(a))}"${mergeable ? ` data-nueva="${esc(newer.id)}" data-vieja="${esc(older.id)}"` : ''}>
    <div class="cab"><span class="t">${esc(m.title)}</span></div>
    <div class="cab">${row(m)}</div>
    ${o ? `<div class="det2">→ ${esc(o.title)} · <b>${esc(T.detalle(a))}</b></div>` : `<div class="det2"><b>${esc(T.detalle(a))}</b></div>`}
    ${a.kind === 'review_date' && m.review_reason ? `<div class="det2 quien">${esc(m.review_reason)}</div>` : ''}
    ${(a.kind === 'superseded' || a.kind === 'contradicts') && (a.author || a.reason) ? `<div class="det2 quien">${esc(T.quienDijo(a))}</div>` : ''}
    ${inner}
    <div class="acts">
      <button class="btn" data-r="ver">${isOpen ? T.ocultar : (o ? T.verDos : T.ver)}</button>
      ${a.kind === 'too_long' && !splitting ? `<button class="btn pri" data-r="partir" title="${esc(T.partirT)}">${esc(T.partir)}</button>` : ''}
      ${splitting ? `<button class="btn pri" data-r="confirmarPartir">${esc(T.partirEn(splitting.length))}</button><button class="btn" data-r="cancelarPartir">${esc(T.no)}</button>` : ''}
      ${broken.length ? `<button class="btn pri" data-r="quitar" title="${esc(T.quitarEnlaceT)}">${esc(T.quitarEnlace(broken.length))}</button>` : ''}
      <button class="btn" data-r="bien">${esc(a.kind === 'outdated' ? T.bienDesfasada : T.bien)}</button>
      ${mergeable ? `<button class="btn" data-r="juntar">${esc(merging ? T.no : a.kind === 'outdated' || a.kind === 'contradicts' ? T.juntarIguales : T.juntar)}</button>` : ''}
      ${merging ? `<button class="btn pri" data-r="confirmar">${esc(T.juntarBtn)}</button>` : ''}
      <span class="sp"></span>
      ${a.kind === 'secret' ? `<button class="btn pri" data-r="redactar">${esc(T.redactar)}</button>` : ''}

}

/* ---------- Contradictions: #/contradicciones (1.14) ---------- */
// Each contradicting pair, side by side: «This one holds» leaves the other superseded by it and «Both
// hold» marks them as compatible. The one on the right (`other_id`) is the contradicted one, on hold.
const reviewDate = m => ((m.tags || []).find(t => /^review:\d{4}-\d{2}-\d{2}$/.test(t)) || '').slice(7);
const contradictionReasons = {};
function renderContradictions() {
  const list = warnings.filter(a => a.kind === 'contradicts');
  const card = a => {
    const m = memories.find(x => x.id === a.memory_id), o = memories.find(x => x.id === a.other_id), k = warningKey(a);
    if (!m || !o) return '';
    const side = (x, lb, className) => `<div><span class="lb ${className}">${esc(lb)}</span><span class="t">${esc(x.title)}</span>
        <div class="cab">${scopePill(scopeOf(x))} <span class="kt ${x.kind}">${x.kind}</span> <span class="what">${esc(shortWhen(x.updated_at))}</span></div>
        <div class="md">${md(x.content)}</div>
        <button class="btn pri elegir" data-r="vale" data-id="${esc(x.id)}">${esc(T.con.vale)}</button></div>`;
    return `<div class="av con" data-k="${esc(k)}">
      ${a.author || a.reason ? `<div class="det2 quien">${esc(T.quienDijo(a))}</div>` : ''}
      <div class="par">${side(m, T.con.contradice, 'nueva')}${side(o, T.con.espera, 'espera-lb')}</div>
      <input class="motivo-con" placeholder="${esc(T.con.porQue)}" value="${esc(contradictionReasons[k] || '')}">
      <div class="acts"><button class="btn" data-r="dos">${esc(T.con.valenDos)}</button></div>
    </div>`;
  };
  $('vista').innerHTML = `<div class="rev">
    <div class="hero"><div><h1>${esc(T.con.titulo)}</h1><p>${esc(T.con.sub)}</p></div></div>
    ${list.length ? list.map(card).join('') : `<p class="vacio">${esc(T.con.nada)}</p>`}
  </div>`;
  for (const el of $('vista').querySelectorAll('.av.con')) {
    const a = list.find(x => warningKey(x) === el.dataset.k), reasonInput = el.querySelector('.motivo-con');
    reasonInput.oninput = e => { contradictionReasons[el.dataset.k] = e.target.value; };
    const decide = keep => async () => {
      try {
        const r = await fetch('/api/contradiction', { method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders }, body: JSON.stringify({ a: a.memory_id, b: a.other_id, keep, reason: reasonInput.value.trim() }) });
        if (!r.ok) throw new Error(await r.text());
        delete contradictionReasons[el.dataset.k];
        toast(keep === 'both' ? T.con.dos : T.con.una, 6000);
        await load();
      } catch (e) { toast(T.error + ': ' + e.message); }
    };
    for (const b of el.querySelectorAll('[data-r="vale"]')) b.onclick = decide(b.dataset.id);
    el.querySelector('[data-r="dos"]').onclick = decide('both');
  }
}

// What was forgotten here or on another machine, which can be brought back during the trash days (30 by
// default, OMOIKANE_TRASH_DAYS). Before, it went at the end of Review, behind all the warnings, and wasn't seen.

  const rows = trash.map(o => `<div class="av trash" data-t="${esc(o.id)}">

      <div class="cab">${scopePill(o.project || (o.space ? SPACE_PREFIX + o.space : ''))} <span class="kt ${o.kind}">${o.kind}</span> <span class="what">${esc(T.olvidadaPor(o.by, shortWhen(o.deleted_at)))}</span></div>
      <div class="acts"><button class="btn pri" data-r="restaurar">${esc(T.restaurar)}</button></div>

  $('vista').innerHTML = `<div class="rev">

}

/* ---------- Projects ---------- */
function kindMix(ms) {
  const c = {}; for (const t of KINDS) c[t] = 0;
  for (const m of ms) c[m.kind] = (c[m.kind] || 0) + 1;
  return `<div class="mix">${KINDS.filter(t => c[t]).map(t => `<i class="${t}" style="flex:${c[t]}" title="${t}: ${c[t]}"></i>`).join('')}</div>`;
}
function renderProjects() {
  const statuses = latestStatuses(), projs = projects();
  // Groups: each space (its own and its projects), then the projects without a space and global last.
  const groups = new Map(spaces.map(s => [s.key, []]));
  groups.set('', []);
  for (const x of projs) {
    if (!x.p) continue;
    const k = spaceOf(x.p) || '';
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  }
  // The space's own, first within its group.
  for (const l of groups.values()) l.sort((a, b) => isSpace(b.p) - isSpace(a.p));
  const global = projs.find(x => x.p === '');
  const card = ({ p, n }) => {
    const e = statuses[p], ms = ofProject(p), projectEntry = projectEntries.find(x => x.path === p);
    return `<a class="card${isSpace(p) ? ' esp' : ''}" href="${projectLink(p)}">
        <div class="hd"><span class="nm">${isSpace(p) ? '◇ ' : ''}${esc(displayName(p))}</span><span class="n">${projectEntry && projectEntry.gone ? `<span class="ido">${esc(T.yaNoEsta)}</span>&ensp;` : ''}${esc(T.memoriasN(n))}</span></div>
        <div class="path" title="${esc(isSpace(p) ? '' : p)}">${esc(isSpace(p) ? T.espacioPath(displayName(p)) : p || T.globalPath)}</div>
        ${kindMix(ms)}
        ${e ? `<div class="where"><div class="lb">${T.donde} <span>${esc(shortWhen(e.updated_at))}</span></div><div class="txt">${esc(excerpt(e.content))}</div></div>` : `<div class="where nada">${T.sinEstado}</div>`}
      </a>`;
  };
  const withSpaces = spaces.length > 0;
  const section = (k, l) => {
    if (!l.length) return '';
    if (!withSpaces) return `<div class="grid">${l.map(card).join('')}</div>`;
    const projectCount = l.filter(x => !isSpace(x.p)).length, memoryCount = l.reduce((s, x) => s + x.n, 0);
    const header = k ? `<h2 class="esp">${esc(spaceName(k))}</h2><span>${esc(T.espacioDe(spaceName(k)))} · ${esc(T.enEspacio(projectCount, memoryCount))}</span>`
      : `<h2>${esc(T.personal)}</h2><span>${esc(T.personalSub)}</span>`;
    return `<div class="gsp">${header}</div><div class="grid">${l.map(card).join('')}</div>`;
  };
  const body = [...groups.entries()].filter(([k]) => k).sort((a, b) => spaceName(a[0]).localeCompare(spaceName(b[0]))).map(([k, l]) => section(k, l)).join('')
    + section('', groups.get(''))
    + (!global ? '' : withSpaces ? `<div class="gsp"><h2>${esc(T.global)}</h2><span>${esc(T.globalSub)}</span></div><div class="grid">${card(global)}</div>` : '');
  $('vista').innerHTML = `<div class="pjs">
    <div class="hero">
      <div><h1>${T.dondeTitulo}</h1><p>${T.dondeSub}</p></div>
      <div class="stats">

        <div class="stat"><b>${projs.filter(x => x.p && !isSpace(x.p)).length}</b><span>${esc(T.proyectos.toLowerCase())}</span></div>
        ${withSpaces ? `<div class="stat"><b>${spaces.length}</b><span>${esc(T.espacios)}</span></div>` : ''}
        <div class="stat"><b>${Object.keys(statuses).length}</b><span>${esc(T.conEstado)}</span></div>
      </div>
    </div>
    ${openDecisionsHTML()}
    ${withSpaces ? body : `<div class="grid">${projs.map(card).join('')}</div>`}
    <div class="leyenda">${KINDS.map(t => `<span><i class="k ${t}"></i>${t}</span>`).join('')}</div>
  </div>`;
  wireOpenDecisions();
}

        ${more(r.count, items)}
        <div><a class="btn" href="#/revisar">${esc(P.verRev)}</a></div>` : `<p class="vacio">${esc(P.nadaRev)}</p>`}
      ${x.paused.length ? `<div class="sub">${esc(P.pausa)}<span>${x.paused.length}</span></div>${pausedRows}` : ''}
      <div class="sub">${esc(P.olvidadas)}<span>${esc(P.olvidadasSub(d.months))} · ${x.untouched.count}</span></div>
      ${x.untouched.count ? `<div class="lst">${x.untouched.items.slice(0, 6).map(m => row(m, `${where(m, x)} · ${who(m.author)}`)).join('')}</div>${more(x.untouched.count, x.untouched.items.slice(0, 6))}` : `<p class="vacio">${esc(P.nadaOlv)}</p>`}
    </div>`;
  };
  const section = x => {
    const n = x.projects.length;
    const header = x.key ? `<h2 class="esp">${esc(x.name || x.key)}</h2><span>${esc(T.espacioDe(x.name || x.key))} · ${esc(T.enEspacio(n, x.memories))}</span>`
      : `<h2>${esc(P.sinEspacio)}</h2><span>${esc(P.sinEspacioSub)} · ${esc(T.enEspacio(n, x.memories))}</span>`;
    return `<div class="gsp">${header}</div><div class="tres">${whatBlock(x)}${whoBlock(x)}${outdatedBlock(x)}</div>`;
  };
  $('vista').innerHTML = `<div class="pan">
    <div class="hero">
      <div><h1>${esc(P.titulo)}</h1><p>${esc(P.sub)}</p></div>
      <div class="stats">
        <div class="stat"><b>${sp.filter(x => x.key).length}</b><span>${esc(T.espacios)}</span></div>
        <div class="stat"><b>${sum(x => x.projects.length)}</b><span>${esc(T.proyectos.toLowerCase())}</span></div>
        <div class="stat"><b>${sum(x => x.memories)}</b><span>${esc(T.memorias.toLowerCase())}</span></div>
        <div class="stat"><b>${authorCount}</b><span>${esc(P.autores)}</span></div>
        <div class="stat"><b>${sum(x => x.review.count)}</b><span>${esc(P.aRevisar)}</span></div>
      </div>
    </div>
    <p class="alcance">${esc(scopeNote)}</p>
    <label class="ctl">${esc(P.sinTocar)} <select id="meses">${[3, 6, 12, 24].map(n => `<option value="${n}"${n === d.months ? ' selected' : ''}>${esc(P.meses(n))}</option>`).join('')}</select></label>
    ${sp.length ? sp.map(section).join('') : `<p class="vacio">${esc(P.nada)}</p>`}
    ${d.global_memories ? `<p class="alcance" style="margin-top:18px">${esc(P.global(d.global_memories))}</p>` : ''}
  </div>`;
  const v = $('vista');
  for (const b of v.querySelectorAll('[data-ir]')) b.onclick = () => goTo(b.dataset.ir);
  wireRunButtons(v);
  for (const b of v.querySelectorAll('[data-copia]')) b.onclick = async () => {
    try { await navigator.clipboard.writeText(b.dataset.copia); toast(T.copiado); } catch (e) { toast(b.dataset.copia); }
  };
  $('meses').onchange = async e => { monthsUntouched = +e.target.value; await loadOverview(); render(); };
}

/* ---------- Open decisions ---------- */
// The decisions waiting for the person (tag `open`), from newest to oldest: the same
// the agent gets when a session starts.
const OPEN_TAG = 'open';
const BLOCKING_TAG = 'blocking';
const isBlocking = m => (m.tags || []).includes(BLOCKING_TAG) || m.blocking === true;
// Blocking ones first (sort is stable: within each group, from newest to oldest).
const openDecisions = () => memories.filter(m => m.kind === 'decision' && m.tags.includes(OPEN_TAG) && inSpace(m)).sort((a, b) => isBlocking(b) - isBlocking(a));
const priorityMark = m => isBlocking(m) ? `<span class="blk" title="${esc(T.bloqueanteT)}">${esc(T.bloqueante)}</span>` : `<span class="blk later">${esc(T.paraDespues)}</span>`;
function openDecisionsHTML() {
  const ds = openDecisions();
  if (!ds.length) return '';
  return `<div class="abiertas">
    <div class="gsp"><h2>${esc(T.abiertasTitulo)}</h2><span>${esc(String(ds.length))}</span></div>
    <p class="vacio" style="padding:0 0 10px">${T.abiertasSub}</p>
    ${ds.map(m => `<div class="av${isBlocking(m) ? ' bloq' : ''}" data-abierta="${esc(m.id)}">
      <div class="cab">${priorityMark(m)}<span class="t">${esc(m.title)}</span>${scopePill(scopeOf(m))}<span class="what">${esc(shortWhen(m.updated_at))}</span></div>
      <div class="md">${md(m.content)}</div>
      <textarea placeholder="${esc(T.respuesta)}" rows="2"></textarea>
      <div class="acts"><button class="btn pri" data-r="decidir">${esc(T.decidir)}</button><button class="btn" data-r="supuesto" title="${esc(T.seQuedaT)}">${esc(T.seQueda)}</button></div>
    </div>`).join('')}
  </div>`;
}
// Decide: the answer is appended to the end of the memory and the `open` tag is removed. The button is
// disabled meanwhile (two clicks appended the answer twice), and the tags are read from the memory
// right before: the page's may be old, and sending them would overwrite those added later.
function wireOpenDecisions() {
  for (const el of $('vista').querySelectorAll('[data-abierta]')) {
    const id = el.dataset.abierta;
    const button = el.querySelector('[data-r="decidir"]'), assumeButton = el.querySelector('[data-r="supuesto"]');
    // «Keep the assumption»: the agent went on with what it assumed and that's fine; nothing is written.
    assumeButton.onclick = () => { el.querySelector('textarea').value = T.seQuedaRespuesta; button.onclick(); };
    button.onclick = async () => {
      const answer = el.querySelector('textarea').value.trim();
      if (!answer) { el.querySelector('textarea').focus(); return; }
      button.disabled = true; assumeButton.disabled = true;
      try {
        await action(async () => {
          const current = await tool('get', { id });
          await tool('update', {
            id,
            append: `${T.decidido} (${new Date().toISOString().slice(0, 10)}): ${answer}`,
            tags: [...(current.tags || []).filter(t => t !== OPEN_TAG && t !== BLOCKING_TAG && t !== 'resolved'), 'resolved'],
            reason: T.decididoMotivo,
          });
        });
      } finally {
        // If it went well, the page was already repainted without it; if not, it can be tried again.
        button.disabled = false; assumeButton.disabled = false;
      }
    };
  }
}

let panelMemory = null;
// The project's memories in a ring and those linking from outside (globals or other projects) in
// another, with a line per link. No libraries; only if there is any link.
function graphHTML(ms) {
  // Only those with some link; with many, the labels show on hover.
  const hasLinks = m => (m.links || []).length || linkedFrom(m).length;
  const insideNodes = ms.filter(hasLinks).slice(0, 24), ids = new Set(insideNodes.map(m => m.id)), outside = new Map(), edges = [];
  for (const m of insideNodes) {
    for (const id of m.links || []) { edges.push([m.id, id]); if (!ids.has(id)) outside.set(id, true); }
    for (const x of linkedFrom(m)) { if (!ids.has(x.id)) { edges.push([x.id, m.id]); outside.set(x.id, true); } }
  }
  if (!edges.length) return '';
  const externalNodes = [...outside.keys()].slice(0, 20).map(id => memories.find(x => x.id === id)).filter(Boolean);
  const total = insideNodes.length + externalNodes.length, showLabels = total <= 14;
  const W = 760, H = total > 20 ? 420 : 320, cx = W / 2, cy = H / 2, pos = new Map();
  const ring = (list, rx, ry) => list.forEach((m, i) => { const a = -Math.PI / 2 + 2 * Math.PI * i / Math.max(1, list.length); pos.set(m.id, [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); });
  const r1 = insideNodes.length > 1 ? Math.min(150, 40 + insideNodes.length * 6) : 0;
  ring(insideNodes, r1 * 1.6, r1 * 0.8);
  ring(externalNodes, Math.min(W / 2 - 40, r1 * 1.6 + 120), Math.min(H / 2 - 24, r1 * 0.8 + 70));
  const lines = edges.filter(([a, b]) => pos.has(a) && pos.has(b)).map(([a, b]) => { const [x1, y1] = pos.get(a), [x2, y2] = pos.get(b); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"></line>`; }).join('');
  const node = (m, isInside) => { const [x, y] = pos.get(m.id); return `<circle class="${m.kind}${isInside ? '' : ' fuera'}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${isInside ? 8 : 6}" data-ir="${m.id}"><title>${esc(m.title)}</title></circle>` + (showLabels ? `<text x="${(x + 11).toFixed(1)}" y="${(y + 4).toFixed(1)}">${esc(m.title.slice(0, 28))}</text>` : ''); };
  return `<div class="grafo"><div class="lb">${T.conexiones} · ${insideNodes.length + externalNodes.length}</div><svg viewBox="0 0 ${W} ${H}" role="img">${lines}${insideNodes.map(m => node(m, true)).join('')}${externalNodes.map(m => node(m, false)).join('')}</svg></div>`;
}

function renderProject(p) {
  const ms = ofProject(p).filter(m => !found || found.includes(m.id)), e = latestStatuses()[p];
  const sorted = found ? found.map(id => ms.find(m => m.id === id)).filter(Boolean) : ms;
  const m = panelMemory && memories.find(x => x.id === panelMemory && scopeOf(x) === p);
  const spaceKey = spaceOf(p), projectEntry = projectEntries.find(x => x.path === p);
  const cols = kindsOf(ms).map(t => {
    const v = sorted.filter(x => x.kind === t), showAll = openColumns[p + t], vis = showAll ? v : v.slice(0, PER_COLUMN);
    return `<div class="col">
      <div class="ch"><i class="k ${t}"></i><span class="kt ${t}">${t}</span><span class="n">${v.length}</span></div>
      ${vis.map(x => `<button class="mc" data-id="${x.id}" aria-current="${m && m.id === x.id}"><span class="t">${x.pinned ? '◆ ' : ''}${esc(x.title)}</span><span class="m">${esc(shortWhen(x.updated_at))}${x.tags.includes(STATUS_TAG) ? ' <span class="stl">status</span>' : ''}</span></button>`).join('')}
      ${v.length > PER_COLUMN ? `<button class="ver-mas" data-col="${t}">${showAll ? T.menos : T.masN(v.length - PER_COLUMN)}</button>` : ''}
    </div>`;
  }).join('');
  $('vista').innerHTML = `<div class="pp${m ? ' con-panel' : ''}">
    <div class="work">
      <div class="crumb"><a href="#/proyectos">${T.proyectos}</a><span>›</span>${spaceKey && !isSpace(p) ? `${scopePill(SPACE_PREFIX + spaceKey)}<span>›</span>` : ''}<b>${isSpace(p) ? '◇ ' : ''}${esc(displayName(p))}</b><span class="mono">${esc(isSpace(p) ? T.espacioPath(displayName(p)) : p || T.globalPath)}</span>${projectEntry && projectEntry.gone ? `<span class="ido">${esc(T.yaNoEsta)}</span>` : ''}</div>
      <div class="head">
        <div>
          <h1>${esc(displayName(p))}</h1>
          ${isSpace(p) ? `<div class="cmd" style="margin-bottom:8px">${projectEntries.filter(x => x.space === spaceKey).map(x => scopePill(x.path)).join('')}</div>` : ''}
          ${e ? `<div class="where"><div class="lb">${T.donde} <span>${esc(shortWhen(e.updated_at))}</span></div><div class="md">${md(e.content)}</div></div>` : `<div class="where nada">${T.sinEstado}</div>`}
        </div>
        <div class="nums">${kindsOf(ms).map(t => `<div class="num"><b>${ms.filter(x => x.kind === t).length}</b><span><i class="k ${t}"></i>${t}</span></div>`).join('')}</div>
      </div>
      ${graphHTML(ms)}
      ${ms.length ? `<div class="cols">${cols}</div>` : `<p class="vacio">${T.nada}</p>`}
    </div>
    ${m ? `<aside class="panel" id="panel">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="kt ${m.kind}">${m.kind}</span>${m.tags.map(t => `<span class="chip">#${esc(t)}</span>`).join('')}<button class="cerrar" id="cerrar">Esc ✕</button></div>
      <h2>${m.pinned ? '◆ ' : ''}${esc(m.title)}</h2>
      ${detailHTML(m, true)}
    </aside>` : ''}
  </div>`;
  const v = $('vista');
  for (const b of v.querySelectorAll('.mc')) b.onclick = () => { panelMemory = panelMemory === b.dataset.id ? null : b.dataset.id; render(); };
  for (const b of v.querySelectorAll('[data-col]')) b.onclick = () => { openColumns[p + b.dataset.col] = !openColumns[p + b.dataset.col]; render(); };
  for (const c of v.querySelectorAll('.grafo [data-ir]')) c.onclick = () => goTo(c.dataset.ir);
  if (m) { $('cerrar').onclick = () => { panelMemory = null; render(); }; wireDetail($('panel'), m); }
}

/* ---------- Search, routes and keyboard ---------- */
let searchTimer;
// Searches like the agent. With a space chosen, in that space (so the 50 results are its own); if the
// server doesn't allow it (it started in a project of another space), in everything, and the filter keeps its own.
async function search() {
  query = $('q').value.trim();
  if (!query) { found = null; render(); return; }
  if (route().vista === 'proyectos' || route().vista === 'panorama') location.hash = '#/';
  const args = { query: query, limit: 50, all_projects: true };
  try {
    let v;
    if (filters.espacio && filters.espacio !== '*') {
      try { v = await tool('search', { query: query, limit: 50, space: filters.espacio }); } catch (e) { v = null; }
    }
    if (!v) v = await tool('search', args);
    found = v.map(x => x.id);
  } catch (e) { toast(T.error + ': ' + e.message); found = []; }
  openKey = null; page = 1; render();
}
$('q').oninput = () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, 180); };
window.addEventListener('hashchange', () => { panelMemory = pendingGoTo; pendingGoTo = null; render(); $('vista').firstElementChild?.querySelector('.feed,.work,.pjs,.pan')?.scrollTo(0, 0); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
  const r = route();
  if (e.key === 'Escape') {
    if (r.vista === 'proyecto' && panelMemory) { panelMemory = null; render(); }
    else if (r.vista === 'memorias' && openKey) { openKey = null; render(); }
    return;
  }
  if (r.vista === 'memorias' && ['j', 'k', 'ArrowDown', 'ArrowUp'].includes(e.key)) {
    e.preventDefault();
    const rows = [...document.querySelectorAll('.row')], i = rows.findIndex(f => f.dataset.ev === openKey);
    const sig = rows[Math.max(0, Math.min(rows.length - 1, i + ((e.key === 'j' || e.key === 'ArrowDown') ? 1 : -1)))];
    if (sig) toggleRow(sig.dataset.ev);
  }
});
document.documentElement.lang = ES ? 'es' : 'en';
$('nav-mem').textContent = T.memorias;
$('nav-pj').textContent = T.proyectos;
$('nav-pan').textContent = T.pan.nav;
$('nav-rev').firstElementChild.textContent = T.revisar;
$('nav-con').firstElementChild.textContent = T.con.nav;
$('nav-pap').firstElementChild.textContent = T.papelera;
load();
</script>
