name: perf

# Keeps recall and search no slower than in the latest Release: downloads its `omoi` (SHA256SUMS
# signature checked with Omoikane's key and the package's SHA-256, as when updating) and measures it
# against this commit's binary on the same runner, interleaved, over the same synthetic database of
# 10,000 memories. Fails if either median is both 25 % and 5 ms higher, twice in a row. The same
# locally: `cargo run --release --example performance` (see CONTRIBUTING.md).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  perf:
    # A single one: it compares two binaries on the same machine, and Linux is the least noisy runner.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf

      - run: cargo build --release --locked --bin omoi

      - name: Recall and search against the latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version, through gh (with the job's token; without it the API has a shared per-IP limit).
          v=$(gh release view --repo marcmayol/omoikane --json tagName --jq .tagName)
          cargo run --release --locked --example performance -- --contra "${v#v}"
