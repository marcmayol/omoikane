name: perf

# Que el recall y la búsqueda no vayan más lentos que en la última Release: baja su `omoi` (firma de
# SHA256SUMS con la clave de Omoikane y SHA-256 del paquete, como al actualizarse) y lo mide contra el
# de este commit en el mismo runner, intercalados, sobre la misma base sintética de 10.000 memorias.
# Falla si la mediana de alguno pasa a la vez un 25 % y 5 ms por encima, dos veces seguidas. Lo mismo
# en local: `cargo run --release --example rendimiento` (ver CONTRIBUTING.md).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

jobs:
  perf:
    # Uno solo: compara dos binarios en la misma máquina, y Linux es el runner menos ruidoso.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf

      - run: cargo build --release --locked --bin omoi

      - name: Recall y búsqueda contra la última Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La versión, por gh (con el token del job; la API sin él tiene un límite por IP compartido).
          v=$(gh release view --repo marcmayol/omoikane --json tagName --jq .tagName)
          cargo run --release --locked --example rendimiento -- --contra "${v#v}"
