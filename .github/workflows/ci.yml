name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      OMOI_MODELO_INT8: ${{ github.workspace }}/../modelo-int8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # El modelo int8 (150 MB) para el test de equivalencia: sin él, el test se salta.
      - uses: actions/cache@v4
        id: modelo
        with:
          path: ${{ github.workspace }}/../modelo-int8
          key: modelo-int8-potion-multilingual-128M-v1
      - name: Descargar el modelo
        if: steps.modelo.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$OMOI_MODELO_INT8"
          for f in model.safetensors tokenizer.json config.json; do
            curl -sSfL --retry 3 -o "$OMOI_MODELO_INT8/$f" \
              "https://huggingface.co/natzx94/potion-multilingual-128M-int8/resolve/main/$f"
          done

      # Un error de sintaxis en el JavaScript de la vista web la deja muerta y
      # cargo no lo ve: se sacan los <script> de src/web.html y node los comprueba.
      - name: Comprobar el JavaScript de la vista web
        run: |
          mkdir -p "$RUNNER_TEMP/webjs"
          node -e '
            const fs = require("fs");
            const h = fs.readFileSync("src/web.html", "utf8");
            const re = /<script[^>]*>([\s\S]*?)<\/script>/g;
            let m, i = 0;
            while ((m = re.exec(h))) fs.writeFileSync(`${process.argv[1]}/web-${++i}.js`, m[1]);
            if (!i) { console.error("src/web.html sin <script>"); process.exit(1); }
          ' "$RUNNER_TEMP/webjs"
          for f in "$RUNNER_TEMP"/webjs/web-*.js; do node --check "$f"; done

      - run: cargo build --release --locked --all-targets
      - run: cargo clippy --release --locked --all-targets -- -D warnings
      - run: cargo test --release --locked -- --nocapture
      - name: Probar el binario
        run: |
          export OMOIKANE_DB="$RUNNER_TEMP/humo.db"
          ./target/release/omoi doctor
          ./target/release/omoi remember -k gotcha -t "Bug en auth" "Fallo de autenticación: el token caduca."
          ./target/release/omoi search "fallo de autenticación" | grep "Bug en auth" >/dev/null
          export OMOIKANE_MODELS="$RUNNER_TEMP/modelos"
          ./target/release/omoi model install --from "$OMOI_MODELO_INT8"
          ./target/release/omoi search "token caduca" --json | grep '"similarity"' >/dev/null
