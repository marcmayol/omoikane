name: release

# Un tag v* compila omoi para cada sistema y publica la Release con los binarios y sus sumas.
# A mano (workflow_dispatch) solo compila y deja los paquetes como artefactos, para probar.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          # Ubuntu 22.04: glibc 2.35, para que el binario funcione también en distribuciones no tan nuevas.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin omoi
      - name: Empaquetar
        run: |
          d=target/${{ matrix.target }}/release
          mkdir paquete
          if [ "${{ matrix.ext }}" = zip ]; then
            cp "$d/omoi.exe" paquete/
            (cd paquete && 7z a -tzip "../omoi-${{ matrix.target }}.zip" omoi.exe >/dev/null)
          else
            cp "$d/omoi" paquete/
            tar -czf "omoi-${{ matrix.target }}.tar.gz" -C paquete omoi
          fi
      - name: Probar el binario empaquetado
        # El de Intel en un Mac ARM corre con Rosetta; los demás, nativos.
        run: |
          d=target/${{ matrix.target }}/release
          "$d/omoi" --version
          OMOIKANE_DB="$RUNNER_TEMP/humo.db" "$d/omoi" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: omoi-${{ matrix.target }}
          path: omoi-${{ matrix.target }}.${{ matrix.ext }}

  publicar:
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Sumas y Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd paquetes
          sha256sum omoi-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" omoi-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Omoikane $GITHUB_REF_NAME" \
            --notes "Install: see the README (one line on Windows, Linux and macOS). Binaries for Windows x64, Linux x64/ARM64 (glibc ≥ 2.35) and macOS Apple Silicon/Intel, with SHA256SUMS."
