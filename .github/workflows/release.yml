name: release

# A v* tag builds omoi for each system, checks that it still works with 1.0.0 (compat.yml) and that
# recall and search are no slower than in the previous Release (perf.yml), and publishes the Release
# with the binaries, their checksums and, as notes, that version's section of CHANGELOG.md.
# Run by hand (workflow_dispatch) it only builds and keeps the packages as artifacts, for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          # Ubuntu 22.04: glibc 2.35, so the binary also runs on not-so-recent distributions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin omoi
      - name: Package
        run: |
          d=target/${{ matrix.target }}/release
          mkdir paquete
          if [ "${{ matrix.ext }}" = zip ]; then
            cp "$d/omoi.exe" paquete/
            (cd paquete && 7z a -tzip "../omoi-${{ matrix.target }}.zip" omoi.exe >/dev/null)
          else
            cp "$d/omoi" paquete/
            tar -czf "omoi-${{ matrix.target }}.tar.gz" -C paquete omoi
          fi
      - name: Smoke-test the packaged binary
        # The Intel one runs under Rosetta on an ARM Mac; the rest run natively.
        run: |
          d=target/${{ matrix.target }}/release
          "$d/omoi" --version
          OMOIKANE_DB="$RUNNER_TEMP/humo.db" "$d/omoi" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: omoi-${{ matrix.target }}
          path: omoi-${{ matrix.target }}.${{ matrix.ext }}

  # 1.x must not break what 1.0 promised: if the compatibility test fails, nothing is published.
  compat:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/compat.yml

  # No version with recall or search slower than the previous one (perf.yml).
  perf:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/perf.yml

  publicar:
    needs: [compilar, compat, perf]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes
        # The "## <version>" section of CHANGELOG.md, up to the next "## ". Without that section, or
        # without its compatibility subsection, there is no Release (as without a signature).
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## / { if (dentro) exit; if ($2 == v) { dentro = 1; next } } dentro { print }' CHANGELOG.md > "$RUNNER_TEMP/notas.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notas.md" || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          grep -q '^### Compatibility' "$RUNNER_TEMP/notas.md" || { echo "the '## $v' section of CHANGELOG.md has no '### Compatibility'"; exit 1; }
          {
            echo
            echo "### Install"
            echo "See the README: one line on Windows, Linux and macOS. Binaries for Windows x64, Linux x64/ARM64 (glibc ≥ 2.35) and macOS Apple Silicon/Intel, with SHA256SUMS and its signature."
          } >> "$RUNNER_TEMP/notas.md"
          cat "$RUNNER_TEMP/notas.md"
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - name: Checksums, signature and Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The Ed25519 private key (PEM) that signs what omoi checks before installing a self-update.
          OMOIKANE_FIRMA: ${{ secrets.OMOIKANE_FIRMA }}
        run: |
          cd paquetes
          sha256sum omoi-* > SHA256SUMS
          cat SHA256SUMS
          # No signature, no Release: omoi refuses to install one without it.
          test -n "$OMOIKANE_FIRMA" || { echo "the OMOIKANE_FIRMA secret is missing"; exit 1; }
          umask 077
          printf '%s\n' "$OMOIKANE_FIRMA" > "$RUNNER_TEMP/firma.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/firma.pem" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkey -in "$RUNNER_TEMP/firma.pem" -pubout -out "$RUNNER_TEMP/publica.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/publica.pem" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          rm -f "$RUNNER_TEMP/firma.pem"
          gh release create "$GITHUB_REF_NAME" omoi-* SHA256SUMS SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Omoikane $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notas.md"
