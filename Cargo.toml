[package]
name = "omoikane"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Local, hybrid-search memory for AI coding agents. One binary, one SQLite file."
repository = "https://github.com/marcmayol/omoikane"
keywords = ["mcp", "memory", "agents", "sqlite", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "omoi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
memmap2 = "0.9.12"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
safetensors = "0.5.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlite-vec = "0.1.9"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
ulid = "3.0.0"

[dev-dependencies]
model2vec-rs = "0.3.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
