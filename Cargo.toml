[package]
name = "omoikane"
version = "1.15.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Eternal memory, alive and lightning fast, for AI coding agents. One Rust binary, one SQLite file, automatic recall."
repository = "https://github.com/marcmayol/omoikane"
keywords = ["mcp", "memory", "agents", "sqlite", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "omoi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# EmbeddingGemma in pure Rust, without ONNX Runtime: CPU only, no dependencies outside the binary.
candle-core = "0.11.1"
candle-nn = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
# f16 weights and the threads of EmbeddingGemma's fast engine (`engine`); they already came with candle.
half = "2.7.1"
rayon = "1.12.0"
memmap2 = "0.9.12"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
safetensors = "0.5.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sqlite-vec = "0.1.9"
tokenizers = { version = "0.21.4", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
ulid = "3.0.0"
# File names in NFC when exporting and importing OKF bundles: macOS (HFS+) stores them in NFD.
unicode-normalization = "0.1.26"
# To download the model; pure Rust with rustls. Pinned to a version more than a month old.
# With `platform-verifier`, the system's roots (Windows, macOS, Linux) and not only Mozilla's:
# behind a company proxy that inspects HTTPS, its root certificate is in the system store.
ureq = { version = "=3.4.2", features = ["platform-verifier"] }
ratatui = "0.30.2"
crossterm = "0.29"
tiny_http = "0.12"
# Sync: deterministic per-line encryption (AES-SIV, RFC 5297), opaque folder names and the
# code for joining another machine.
aes-siv = "=0.8.0"
sha2 = "=0.11.1"
base64 = "=0.22.1"
getrandom = "=0.3.4"
# Checks the Releases' Ed25519 signature when self-updating (it already came with rustls).
ring = "0.17.14"

[target.'cfg(unix)'.dependencies]
# So that `omoi … | head` ends quietly instead of blowing up with "Broken pipe".
libc = "0.2"

[dev-dependencies]
model2vec-rs = "0.3.0"
# The tests' MCP client talks to `omoi mcp` the way an agent would.
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Identifiers stay ASCII: anyone can type them on any keyboard (src/bpe.rs and src/engine.rs had ñ until 1.14.1).
[lints.rust]
non_ascii_idents = "deny"
